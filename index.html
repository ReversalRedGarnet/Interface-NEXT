<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USP STEMP — IT Room Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="menu-page">

  <!-- ── USP STEMP brand bar ── -->
  <div class="site-header">
    <div class="site-header-inner">
      <div class="site-brand">
        <span class="brand-usp">USP</span>
        <span class="brand-sep">·</span>
        <span class="brand-stemp">STEMP</span>
      </div>
      <span class="site-tool">IT Room Monitor</span>
    </div>
  </div>

  <div class="menu-app">

    <header class="menu-header">
      <h1>IT Room Monitor</h1>
      <p class="subtitle">Pick a room to check its devices. Statuses save as you go.</p>
    </header>

    <div class="campus-grid">

      <!-- King George Campus -->
      <div class="campus-card">
        <div class="campus-card-header">
          <h2 class="campus-name">King George Campus</h2>
        </div>
        <div class="room-list" id="rooms-kg">
          <a class="room-link" href="rooms/library.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>Library
          </a>
          <a class="room-link" href="rooms/s28-107.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>S28-107
          </a>
          <a class="room-link" href="rooms/s28-104.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>S28-104
          </a>
        </div>
        <button class="campus-toggle" data-target="rooms-kg" aria-controls="rooms-kg" aria-expanded="true">Hide Rooms ▴</button>
      </div>

      <!-- Lawson Tama Campus -->
      <div class="campus-card">
        <div class="campus-card-header">
          <h2 class="campus-name">Lawson Tama Campus</h2>
        </div>
        <div class="room-list" id="rooms-lt">
          <a class="room-link" href="rooms/gpl.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>GPL
          </a>
          <a class="room-link" href="rooms/mtl.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>MTL
          </a>
        </div>
        <button class="campus-toggle" data-target="rooms-lt" aria-controls="rooms-lt" aria-expanded="true">Hide Rooms ▴</button>
      </div>

    </div>

    <div class="menu-footer">
      <button class="toolbar-btn" id="btn-export-all">⬇ Export All Rooms Report</button>
      <button class="toolbar-btn" id="btn-backup-state">🗄 Backup State (JSON)</button>
      <button class="toolbar-btn" id="btn-restore-state">📤 Restore State (JSON)</button>
      <input type="file" id="restore-state-input" accept="application/json" hidden>
    </div>

  </div><!-- /.menu-app -->

  <script type="module" src="js/main.js"></script>

    <footer class="site-footer">
    <p>A side project by ReversalRedGarnet (s11225524) · © July-2026</p>
  </footer>

</body>
</html>
