<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridkeep</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="menu-page">

  <div class="site-header">
    <div class="site-header-inner">
      <span class="site-tool">Gridkeep</span>
    </div>
  </div>

  <div class="menu-app">

    <header class="menu-header">
      <h1>Gridkeep</h1>
      <p class="subtitle">Click into a building, then a floor, to check its devices.</p>
    </header>

    <div id="campus-root"></div>

    <details class="all-rooms-fallback">
      <summary>Browse all rooms (list view)</summary>

    <div class="site-grid">

      <!-- Northgate Site -->
      <div class="site-card">
        <div class="site-card-header">
          <h2 class="site-name">Northgate Site</h2>
        </div>
        <div class="room-list" id="rooms-northgate">
          <a class="room-link" href="rooms/commons.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>Commons
          </a>
          <a class="room-link" href="rooms/b2-210.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>B2-210
          </a>
          <a class="room-link" href="rooms/b2-204.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>B2-204
          </a>
        </div>
        <button class="site-toggle" data-target="rooms-northgate" aria-controls="rooms-northgate" aria-expanded="true">Hide Rooms ▴</button>
      </div>

      <!-- Riverside Site -->
      <div class="site-card">
        <div class="site-card-header">
          <h2 class="site-name">Riverside Site</h2>
        </div>
        <div class="room-list" id="rooms-riverside">
          <a class="room-link" href="rooms/annex.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>Annex Lab
          </a>
          <a class="room-link" href="rooms/workshop.html">
            <span class="room-link-icon" aria-hidden="true">💻</span>Workshop
          </a>
        </div>
        <button class="site-toggle" data-target="rooms-riverside" aria-controls="rooms-riverside" aria-expanded="true">Hide Rooms ▴</button>
      </div>

    </div>

    </details>

    <div class="menu-footer">
      <button class="toolbar-btn" id="btn-export-all">⬇ Export All Rooms Report</button>
      <button class="toolbar-btn" id="btn-backup-state">🗄 Backup State (JSON)</button>
      <button class="toolbar-btn" id="btn-restore-state">📤 Restore State (JSON)</button>
      <input type="file" id="restore-state-input" accept="application/json" hidden>
    </div>

  </div><!-- /.menu-app -->

  <script type="module" src="js/main.js"></script>

    <footer class="site-footer">
    <p><a href="https://github.com/ReversalRedGarnet">ReversalRedGarnet</a></p>
  </footer>

</body>
</html>
